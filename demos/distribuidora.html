<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Distribuidora del Centro — Demo RodTech</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/demo.css">
</head>
<body>

<div class="demo-strip">
  <b>Demostración</b>
  <span class="sep">·</span>
  <span class="hide-sm">Portal de ejemplo para una distribuidora. Los datos son ficticios.</span>
  <a href="../index.html#ideas">← Volver a RodTech</a>
</div>

<div class="app" id="app"></div>
<div id="toast"></div>

<script src="assets/demo.js"></script>
<script>
let clientes = [
  {n:"Abarrotes Lupita",zona:"Centro",limite:50000,usado:18400,ultimo:"18 jul",nivel:"Mayorista"},
  {n:"Tienda Don Chuy",zona:"Norte",limite:25000,usado:23800,ultimo:"29 jul",nivel:"Minorista"},
  {n:"Mini Súper Ale",zona:"Sur",limite:40000,usado:9200,ultimo:"25 jul",nivel:"Mayorista"},
  {n:"Cremería La Vaca",zona:"Centro",limite:30000,usado:4100,ultimo:"12 jul",nivel:"Minorista"},
];
let pedidos = [
  {folio:"PED-3131",cliente:"Abarrotes Lupita",fecha:"hoy",total:6540,paso:1,ruta:"R-2",entrega:"mañana"},
  {folio:"PED-3128",cliente:"Mini Súper Ale",fecha:"hoy",total:9280,paso:2,ruta:"R-1",entrega:"mañana"},
  {folio:"PED-3120",cliente:"Tienda Don Chuy",fecha:"ayer",total:4310,paso:3,ruta:"R-2",entrega:"hoy"},
  {folio:"PED-3098",cliente:"Cremería La Vaca",fecha:"18 jul",total:12750,paso:4,ruta:"R-3",entrega:"18 jul"},
];
let rutas = [
  {id:"R-1",chofer:"Martín",unidad:"Nissan NP300",paradas:7,hechas:7,km:42},
  {id:"R-2",chofer:"Kike",unidad:"Ford Transit",paradas:9,hechas:5,km:61},
  {id:"R-3",chofer:"Lalo",unidad:"Nissan NP300",paradas:6,hechas:2,km:38},
];
const PASOS = ["Recibido","En preparación","En ruta","Entregado"];
const disponible = c => c.limite - c.usado;
const enRiesgo = () => clientes.filter(c=>disponible(c)/c.limite < 0.15);
const activos = () => pedidos.filter(p=>p.paso<4);

startDemo({
  negocio:"Distribuidora del Centro", rubro:"Abarrotes al mayoreo", emoji:"🚚",
  secciones:[
    {
      id:"panel", nombre:"Panel", ic:"📊",
      titulo:"Operación del día", sub:"Pedidos, rutas y crédito en una sola pantalla",
      render(root){
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><div class="lbl">Pedidos activos</div><div class="val">${activos().length}</div><div class="delta flat">${money(activos().reduce((s,p)=>s+p.total,0))} en tránsito</div></div>
            <div class="kpi"><div class="lbl">Vendido hoy</div><div class="val">${money(pedidos.filter(p=>p.fecha==="hoy").reduce((s,p)=>s+p.total,0))}</div><div class="delta up">▲ 18% vs. ayer</div></div>
            <div class="kpi"><div class="lbl">Crédito colocado</div><div class="val">${money(clientes.reduce((s,c)=>s+c.usado,0))}</div><div class="delta flat">de ${money(clientes.reduce((s,c)=>s+c.limite,0))}</div></div>
            <div class="kpi"><div class="lbl">Entregas del día</div><div class="val">${rutas.reduce((s,r)=>s+r.hechas,0)}/${rutas.reduce((s,r)=>s+r.paradas,0)}</div><div class="delta up">a tiempo</div></div>
          </div>
          ${enRiesgo().length?`<div class="note warn"><span class="ic">💳</span><div>
            <b>${enRiesgo().length} cliente(s) cerca de su límite de crédito</b>
            <span>${enRiesgo().map(c=>c.n+" ("+money(disponible(c))+" disponible)").join(", ")}</span></div></div>`:""}
          <div class="cols">
            <div class="panel">
              <div class="panel-h"><h2>Pedidos en curso</h2></div>
              <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
                <thead><tr><th>Folio</th><th>Cliente</th><th>Estado</th><th class="num">Total</th></tr></thead>
                <tbody>${pedidos.map(p=>`
                  <tr><td class="strong">${esc(p.folio)}</td>
                    <td>${esc(p.cliente)}<br><span style="color:var(--ink-3);font-size:.82rem">Ruta ${esc(p.ruta)} · ${esc(p.entrega)}</span></td>
                    <td><span class="tag ${p.paso===4?"ok":p.paso===3?"info":"warn"}">${PASOS[p.paso-1]}</span></td>
                    <td class="num strong">${money(p.total)}</td></tr>`).join("")}</tbody>
              </table></div></div>
            </div>
            <div class="panel">
              <div class="panel-h"><h2>Ventas por semana</h2></div>
              <div class="panel-b">${chart([
                {k:"S-4",v:78000},{k:"S-3",v:84000},{k:"S-2",v:91000},{k:"S-1",v:88000},{k:"Esta",v:96000,hi:true}])}</div>
            </div>
          </div>`;
      }
    },
    {
      id:"clientes", nombre:"Clientes", ic:"🏪",
      titulo:"Cartera de clientes", sub:"Cada uno con su nivel de precio y su línea de crédito",
      badge:()=>enRiesgo().length||"",
      render(root, refrescar){
        root.innerHTML = `
          <div class="panel">
            <div class="panel-h"><h2>Clientes activos</h2><span class="sub">Corte el día 30</span></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Cliente</th><th>Zona</th><th>Nivel</th><th style="width:190px">Crédito usado</th><th class="num">Disponible</th><th></th></tr></thead>
              <tbody>${clientes.map((c,i)=>`
                <tr>
                  <td><div class="cellmain"><div class="em">🏪</div>
                    <div><b>${esc(c.n)}</b><span>Último pedido: ${esc(c.ultimo)}</span></div></div></td>
                  <td style="color:var(--ink-3)">${esc(c.zona)}</td>
                  <td><span class="tag ${c.nivel==="Mayorista"?"neutral":"info"}">${esc(c.nivel)}</span></td>
                  <td>${bar(c.usado/c.limite)}
                    <span style="font-size:.8rem;color:var(--ink-3)">${money(c.usado)} de ${money(c.limite)}</span></td>
                  <td class="num strong" style="color:${disponible(c)/c.limite<0.15?"var(--bad)":"inherit"}">${money(disponible(c))}</td>
                  <td class="num">${disponible(c)/c.limite<0.15
                    ? `<button class="btn sm" data-amp="${i}">Ampliar línea</button>`:""}</td>
                </tr>`).join("")}</tbody>
            </table></div></div>
          </div>`;
        root.querySelectorAll("[data-amp]").forEach(b=>b.onclick=()=>{
          const c = clientes[+b.dataset.amp];
          c.limite = Math.round(c.limite*1.4/1000)*1000;
          toast("Línea de "+esc(c.n)+" ampliada a "+money(c.limite),"💳");
          refrescar();
        });
      }
    },
    {
      id:"pedidos", nombre:"Pedidos", ic:"📦",
      titulo:"Seguimiento de pedidos", sub:"Tus clientes ven este mismo avance desde su celular",
      render(root, refrescar){
        root.innerHTML = pedidos.map(p=>`
          <div class="panel">
            <div class="panel-h">
              <h2>${esc(p.folio)}</h2>
              <span class="sub">${esc(p.cliente)} · ruta ${esc(p.ruta)} · entrega ${esc(p.entrega)}</span>
              <div class="right">
                <span class="tag ${p.paso===4?"ok":"info"}">${PASOS[p.paso-1]}</span>
                <b>${money(p.total)}</b>
                ${p.paso<4?`<button class="btn sm primary" data-av="${esc(p.folio)}">Avanzar</button>`:""}
              </div>
            </div>
            <div class="panel-b">
              <div class="tl">${PASOS.map((s,i)=>`
                <div class="tl-i ${i<p.paso-1?"done":i===p.paso-1?"now":""}">
                  <div class="tl-d">${i<p.paso-1?"✓":i===p.paso-1?"●":""}</div>
                  <div><b>${s}</b>${i===p.paso-1?"<span>ahora</span>":""}</div>
                </div>`).join("")}</div>
            </div>
          </div>`).join("");
        root.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{
          const p = pedidos.find(x=>x.folio===b.dataset.av);
          p.paso++;
          toast(p.folio+" → "+PASOS[p.paso-1]+" · aviso enviado al cliente","📲");
          refrescar();
        });
      }
    },
    {
      id:"rutas", nombre:"Rutas", ic:"🗺️",
      titulo:"Rutas de reparto", sub:"Cada chofer ve su ruta del día y marca cada entrega",
      render(root){
        root.innerHTML = `
          <div class="kpis">
            ${rutas.map(r=>`
              <div class="kpi">
                <div class="lbl">Ruta ${esc(r.id)} · ${esc(r.chofer)}</div>
                <div class="val">${r.hechas}/${r.paradas}</div>
                <div class="delta ${r.hechas===r.paradas?"up":"flat"}">${r.hechas===r.paradas?"ruta completa":"en curso"} · ${r.km} km</div>
                <div style="margin-top:10px">${bar(r.hechas/r.paradas)}</div>
              </div>`).join("")}
          </div>
          <div class="panel">
            <div class="panel-h"><h2>Detalle por unidad</h2></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Ruta</th><th>Chofer</th><th>Unidad</th><th class="num">Paradas</th><th class="num">Entregadas</th><th class="num">Kilómetros</th></tr></thead>
              <tbody>${rutas.map(r=>`
                <tr>
                  <td><span class="tag neutral">${esc(r.id)}</span></td>
                  <td><b>${esc(r.chofer)}</b></td>
                  <td style="color:var(--ink-3)">${esc(r.unidad)}</td>
                  <td class="num">${r.paradas}</td>
                  <td class="num strong">${r.hechas}</td>
                  <td class="num">${r.km} km</td>
                </tr>`).join("")}</tbody>
            </table></div></div>
          </div>`;
      }
    }
  ]
});
</script>
</body>
</html>
