<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Ferretería El Tornillo — Demo RodTech</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/demo.css">
</head>
<body>

<div class="demo-strip">
  <b>Demostración</b>
  <span class="sep">·</span>
  <span class="hide-sm">Sistema de ejemplo para una ferretería. Arma una cotización, conviértela en venta y mira cómo baja el inventario.</span>
  <a href="../index.html#ideas">← Volver a RodTech</a>
</div>

<div class="app" id="app"></div>
<div id="toast"></div>

<script src="assets/demo.js"></script>
<script>
const hora = () => new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false});
let S = {
  seqCot: 872, seqVta: 1180,
  catalogo: [
    {sku:"FER-1021",n:"Cemento gris 50 kg",cat:"Construcción",p:238,st:64,min:30},
    {sku:"FER-1088",n:"Varilla 3/8 pulg (12 m)",cat:"Construcción",p:165,st:120,min:60},
    {sku:"FER-1130",n:"Bulto de arena 50 kg",cat:"Construcción",p:85,st:18,min:40},
    {sku:"FER-1207",n:"Block 15×20×40",cat:"Construcción",p:18,st:500,min:200},
    {sku:"PLO-2010",n:"Tubo PVC 4 pulg (6 m)",cat:"Plomería",p:210,st:26,min:20},
    {sku:"PLO-2054",n:"Llave de paso 1/2 pulg",cat:"Plomería",p:145,st:9,min:15},
    {sku:"ELE-3005",n:"Cable THW cal. 12 (m)",cat:"Eléctrico",p:14,st:300,min:150},
    {sku:"ELE-3077",n:"Pastilla térmica 20A",cat:"Eléctrico",p:135,st:22,min:12},
    {sku:"PIN-4001",n:"Vinílica 19 L blanco",cat:"Pintura",p:1150,st:12,min:8},
    {sku:"PIN-4103",n:"Brocha 4 pulg",cat:"Pintura",p:65,st:55,min:30},
  ],
  cotizaciones: [
    {folio:"COT-871",cliente:"Constructora Ruiz",obra:"Torre Reforma, 3er nivel",fecha:"hoy",items:{"FER-1021":10,"FER-1088":4},estado:"Enviada"},
    {folio:"COT-812",cliente:"Constructora Hernández",obra:"Av. Juárez 2a etapa",fecha:"22 jul",items:{"FER-1207":400,"FER-1021":25},estado:"Aceptada"},
    {folio:"COT-807",cliente:"Ing. Salas",obra:"Remodelación local",fecha:"18 jul",items:{"PIN-4001":2,"PIN-4103":6},estado:"Pendiente"},
    {folio:"COT-799",cliente:"Sra. Domínguez",obra:"Casa habitación",fecha:"15 jul",items:{"PLO-2010":5,"PLO-2054":3},estado:"Vencida"},
  ],
  ventas: [
    {folio:"V-1179",cliente:"Mostrador",hora:"10:42",items:{"ELE-3005":40,"ELE-3077":2},pago:"Efectivo"},
    {folio:"V-1178",cliente:"Sr. Aguilar",hora:"09:15",items:{"PIN-4001":1,"PIN-4103":2},pago:"Tarjeta"},
  ],
  carrito: {},
};
const find = s => S.catalogo.find(x=>x.sku===s);
const subDe = items => Object.entries(items).reduce((s,[k,q])=>s+(find(k)?find(k).p:0)*q,0);
const descDe = items => subDe(items)>=3000 ? Math.round(subDe(items)*0.05) : 0;
const ivaDe = items => Math.round((subDe(items)-descDe(items))*0.16);
const totalDe = items => subDe(items)-descDe(items)+ivaDe(items);
const piezas = () => Object.values(S.carrito).reduce((a,b)=>a+b,0);
const bajos = () => S.catalogo.filter(p=>p.st<p.min);
const tagEstado = e => e==="Aceptada"?"ok":e==="Enviada"?"info":e==="Pendiente"?"warn":"bad";
const ventasHoy = () => S.ventas.reduce((s,v)=>s+totalDe(v.items),0);

/* Descuenta inventario y registra la venta. Avisa si no alcanza. */
function vender(items, cliente, pago, refrescar){
  const faltan = Object.entries(items).filter(([k,q])=>find(k) && find(k).st<q);
  if(faltan.length){ toast("No alcanza: "+faltan.map(([k,q])=>find(k).n+" (hay "+find(k).st+", pides "+q+")").join(", "),"⚠️"); return false; }
  Object.entries(items).forEach(([k,q])=>{ if(find(k)) find(k).st-=q; });
  const v={folio:"V-"+(S.seqVta++),cliente,hora:hora(),items:{...items},pago};
  S.ventas.unshift(v);
  toast(v.folio+" registrada · "+money(totalDe(items))+" · inventario descontado","💰");
  if(bajos().length) setTimeout(()=>toast(bajos().length+" producto(s) quedaron bajo el mínimo","📦"),2600);
  refrescar(); return true;
}

const resumenHTML = items => `
  ${Object.entries(items).map(([k,q])=>`<div class="r"><span>${q}× ${esc(find(k).n)}</span><b>${money(find(k).p*q)}</b></div>`).join("")}
  <div class="r t"><span>Subtotal</span><span>${money(subDe(items))}</span></div>
  ${descDe(items)?`<div class="r" style="color:var(--ok)"><span>Descuento volumen 5%</span><span>−${money(descDe(items))}</span></div>`:""}
  <div class="r"><span>IVA 16%</span><span>${money(ivaDe(items))}</span></div>
  <div class="r t"><span>Total</span><span>${money(totalDe(items))}</span></div>`;

const DEMO = {
  negocio:"Ferretería El Tornillo", rubro:"Materiales", emoji:"🔩",
  estado:{clave:"ferreteria", get:()=>S, set:o=>{S=o;}},
  secciones:[
    {
      id:"cotizador", nombre:"Cotizar / vender", ic:"🧮",
      titulo:"Cotizar o vender", sub:"Lo que a mano toma media hora, aquí son dos minutos",
      badge:()=>piezas()||"",
      render(root, refrescar){
        root.innerHTML = `
          <div class="cols">
            <div class="panel">
              <div class="panel-h"><h2>Catálogo</h2>
                <div class="right"><input class="field search" id="q" placeholder="🔍 Buscar por nombre o código…"></div></div>
              <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
                <thead><tr><th>Producto</th><th class="num">Existencia</th><th class="num">Precio</th><th class="num">Cantidad</th></tr></thead>
                <tbody id="filas"></tbody></table></div></div>
            </div>
            <div class="panel">
              <div class="panel-h"><h2>Resumen</h2>${piezas()?`<div class="right"><button class="btn sm" id="vaciar">Vaciar</button></div>`:""}</div>
              <div class="panel-b" id="resumen"></div>
            </div>
          </div>`;
        const pintarResumen = () => {
          const r = document.getElementById("resumen");
          if(!piezas()){ r.innerHTML = `<div class="empty"><div class="big">🧾</div><b>Sin productos</b>
            <p>Agrega piezas del catálogo y el total se calcula solo, con IVA y descuento por volumen.</p></div>`; return; }
          r.innerHTML = `<div class="ticket">${resumenHTML(S.carrito)}</div>
            ${subDe(S.carrito)<3000?`<div class="note warn" style="margin-top:12px"><span class="ic">💡</span><div>
              <b>Faltan ${money(3000-subDe(S.carrito))} para el 5%</b><span>El descuento por volumen entra desde $3,000</span></div></div>`:""}
            <div class="actions" style="margin-top:12px">
              <button class="btn primary" id="vender" style="flex:1">Cobrar ahora</button>
              <button class="btn" id="cotizar" style="flex:1">Guardar cotización</button></div>`;
          document.getElementById("vender").onclick = () => drawer("Cobrar venta",`
              <div class="ticket">${resumenHTML(S.carrito)}</div>
              <div class="fc-row">${campo("Cliente",`<input name="cli" value="Mostrador" required>`)}
              ${campo("Forma de pago",`<select name="pago">${opciones(["Efectivo","Tarjeta","Transferencia"])}</select>`)}</div>`,
            d=>{ const ok=vender(S.carrito,d.cli,d.pago,()=>{}); if(!ok) return false; S.carrito={}; refrescar(); },{enviar:"Registrar venta"});
          document.getElementById("cotizar").onclick = () => drawer("Guardar cotización",`
              ${campo("Cliente",`<input name="cli" required placeholder="Constructora, arquitecto o particular">`)}
              ${campo("Obra o referencia",`<input name="obra" placeholder="Casa en Col. Centro, 2a etapa…">`)}
              ${campo("Vigencia",`<select name="vig">${opciones([["7","7 días"],["15","15 días"],["30","30 días"]],"15")}</select>`)}
              <div class="ticket">${resumenHTML(S.carrito)}</div>`,
            d=>{ const folio="COT-"+(S.seqCot++);
              S.cotizaciones.unshift({folio,cliente:d.cli,obra:d.obra||"—",fecha:"hoy",items:{...S.carrito},estado:"Enviada",vig:+d.vig});
              S.carrito={}; toast(folio+" enviada por WhatsApp a "+d.cli,"📲"); refrescar(); },{enviar:"Guardar y enviar"});
        };
        const pintarFilas = () => {
          const q = (document.getElementById("q").value||"").toLowerCase();
          const lista = S.catalogo.filter(p=>(p.n+" "+p.sku).toLowerCase().includes(q));
          document.getElementById("filas").innerHTML = lista.length ? lista.map(p=>`
            <tr>
              <td><b>${esc(p.n)}</b><br><span style="color:var(--ink-3);font-size:.8rem">${p.sku} · ${esc(p.cat)}</span></td>
              <td class="num">${p.st<p.min?`<span class="tag bad">${p.st}</span>`:p.st}</td>
              <td class="num strong">${money(p.p)}</td>
              <td class="num" style="white-space:nowrap">
                <button class="btn sm" data-m="${p.sku}">−</button>
                <b style="display:inline-block;min-width:26px;text-align:center">${S.carrito[p.sku]||0}</b>
                <button class="btn sm" data-p="${p.sku}">+</button></td>
            </tr>`).join("") : `<tr><td colspan="4"><div class="empty"><b>Sin resultados</b><p>Prueba con otro nombre o código.</p></div></td></tr>`;
          document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{
            S.carrito[b.dataset.p]=(S.carrito[b.dataset.p]||0)+1; guardarEstado(DEMO); pintarFilas(); pintarResumen(); });
          document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{
            const k=b.dataset.m; if(S.carrito[k]){S.carrito[k]--; if(!S.carrito[k])delete S.carrito[k];}
            guardarEstado(DEMO); pintarFilas(); pintarResumen(); });
        };
        pintarFilas(); pintarResumen();
        document.getElementById("q").oninput = pintarFilas;
        const vac=document.getElementById("vaciar"); if(vac) vac.onclick=()=>{S.carrito={};refrescar();};
      }
    },
    {
      id:"cotizaciones", nombre:"Cotizaciones", ic:"📄",
      titulo:"Cotizaciones", sub:"Todas quedan guardadas, con su estado y su vigencia",
      badge:()=>S.cotizaciones.filter(c=>c.estado==="Pendiente"||c.estado==="Enviada").length||"",
      render(root, refrescar){
        const C=S.cotizaciones, aceptadas = C.filter(c=>c.estado==="Aceptada");
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><div class="lbl">Cotizado este mes</div><div class="val">${money(C.reduce((s,c)=>s+totalDe(c.items),0))}</div><div class="delta flat">${C.length} cotizaciones</div></div>
            <div class="kpi"><div class="lbl">Convertidas en venta</div><div class="val">${aceptadas.length}</div><div class="delta up">${money(aceptadas.reduce((s,c)=>s+totalDe(c.items),0))}</div></div>
            <div class="kpi"><div class="lbl">Tasa de cierre</div><div class="val">${C.length?Math.round(aceptadas.length/C.length*100):0}%</div><div class="delta flat">de lo cotizado</div></div>
          </div>
          <div class="panel">
            <div class="panel-h"><h2>Historial</h2></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Folio</th><th>Cliente / obra</th><th>Fecha</th><th class="num">Total</th><th>Estado</th><th></th></tr></thead>
              <tbody>${C.map(c=>`
                <tr>
                  <td class="strong">${esc(c.folio)}</td>
                  <td><b>${esc(c.cliente)}</b><br><span style="color:var(--ink-3);font-size:.82rem">${esc(c.obra)} · ${Object.keys(c.items).length} productos</span></td>
                  <td style="color:var(--ink-3)">${esc(c.fecha)}</td>
                  <td class="num strong">${money(totalDe(c.items))}</td>
                  <td><span class="tag ${tagEstado(c.estado)}">${esc(c.estado)}</span></td>
                  <td class="num"><div class="actions" style="justify-content:flex-end">
                    <button class="btn sm" data-ver="${esc(c.folio)}">Ver</button>
                    ${c.estado==="Enviada"||c.estado==="Pendiente"?`<button class="btn sm primary" data-ok="${esc(c.folio)}">Convertir en venta</button>`:""}
                    ${c.estado==="Vencida"?`<button class="btn sm" data-re="${esc(c.folio)}">Reactivar</button>`:""}
                  </div></td>
                </tr>`).join("")}</tbody>
            </table></div></div>
          </div>`;
        root.querySelectorAll("[data-ver]").forEach(b=>b.onclick=()=>{
          const c=C.find(x=>x.folio===b.dataset.ver);
          drawer(c.folio+" · "+c.cliente,`<p style="font-size:.9rem;color:var(--ink-2)">${esc(c.obra)} · ${esc(c.fecha)}</p><div class="ticket">${resumenHTML(c.items)}</div>`,
            ()=>toast("PDF de "+c.folio+" enviado por WhatsApp","📲"),{enviar:"Reenviar PDF"});
        });
        root.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{
          const c = C.find(x=>x.folio===b.dataset.ok);
          drawer("Convertir "+c.folio+" en venta",`<div class="ticket">${resumenHTML(c.items)}</div>
            ${campo("Forma de pago",`<select name="pago">${opciones(["Transferencia","Efectivo","Tarjeta","Crédito 30 días"])}</select>`)}`,
            d=>{ if(!vender(c.items,c.cliente,d.pago,()=>{})) return false; c.estado="Aceptada"; refrescar(); },{enviar:"Confirmar venta"});
        });
        root.querySelectorAll("[data-re]").forEach(b=>b.onclick=()=>{
          const c=C.find(x=>x.folio===b.dataset.re); c.estado="Enviada"; c.fecha="hoy"; toast(c.folio+" reactivada con precios de hoy","🔁"); refrescar(); });
      }
    },
    {
      id:"ventas", nombre:"Ventas", ic:"💰",
      titulo:"Ventas del día", sub:"Cada venta descuenta inventario al momento",
      render(root){
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><div class="lbl">Vendido hoy</div><div class="val">${money(ventasHoy())}</div><div class="delta flat">${S.ventas.length} tickets</div></div>
            <div class="kpi"><div class="lbl">Ticket promedio</div><div class="val">${money(S.ventas.length?Math.round(ventasHoy()/S.ventas.length):0)}</div><div class="delta flat">con IVA</div></div>
            <div class="kpi"><div class="lbl">Efectivo en caja</div><div class="val">${money(S.ventas.filter(v=>v.pago==="Efectivo").reduce((s,v)=>s+totalDe(v.items),0))}</div><div class="delta flat">para el corte</div></div>
          </div>
          <div class="panel">
            <div class="panel-h"><h2>Tickets</h2></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Folio</th><th>Cliente</th><th>Hora</th><th>Productos</th><th>Pago</th><th class="num">Total</th></tr></thead>
              <tbody>${S.ventas.map(v=>`<tr>
                <td class="strong">${esc(v.folio)}</td><td>${esc(v.cliente)}</td><td style="color:var(--ink-3)">${v.hora}</td>
                <td style="font-size:.86rem">${Object.entries(v.items).map(([k,q])=>q+"× "+esc(find(k)?find(k).n:k)).join("<br>")}</td>
                <td><span class="tag neutral">${esc(v.pago)}</span></td><td class="num strong">${money(totalDe(v.items))}</td></tr>`).join("")}</tbody>
            </table></div></div></div>`;
      }
    },
    {
      id:"inventario", nombre:"Inventario", ic:"📦",
      titulo:"Inventario", sub:"Con aviso automático a distribuidores cuando algo baja del mínimo",
      badge:()=>bajos().length||"",
      accion:{txt:"Pedir a distribuidores", fn:(refrescar)=>{
        if(!bajos().length){ toast("Todo por encima del mínimo","👌"); return; }
        drawer("Orden de compra",`<p style="font-size:.9rem;color:var(--ink-2)">Se pide lo necesario para llegar al doble del mínimo:</p>
          <div class="ticket">${bajos().map(p=>`<div class="r"><span>${esc(p.n)}</span><b>+${p.min*2-p.st} pz</b></div>`).join("")}</div>`,
          ()=>{ const n=bajos().length; bajos().forEach(p=>{ p.st = p.min*2; }); toast("Orden de compra enviada para "+n+" productos","🚚"); refrescar(); },{enviar:"Enviar orden"});
      }},
      render(root, refrescar){
        root.innerHTML = `
          ${bajos().length?`<div class="note bad"><span class="ic">⚠️</span><div>
            <b>${bajos().length} productos por debajo del mínimo</b>
            <span>${bajos().map(p=>p.n).join(", ")}</span></div></div>`:
            `<div class="note ok"><span class="ic">✅</span><div><b>Inventario sano</b>
            <span>Nada por debajo del mínimo. El sistema vigila esto por ti todos los días.</span></div></div>`}
          <div class="panel">
            <div class="panel-h"><h2>Existencias por producto</h2><div class="right">
              <button class="btn sm" id="entrada">+ Entrada de mercancía</button>
              <button class="btn sm" id="nuevo">+ Nuevo producto</button></div></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Código</th><th>Producto</th><th class="num">Hay</th><th class="num">Mínimo</th><th style="width:170px">Nivel</th><th class="num">Valor</th></tr></thead>
              <tbody>${S.catalogo.map(p=>`
                <tr>
                  <td style="color:var(--ink-3)">${p.sku}</td>
                  <td><b>${esc(p.n)}</b></td>
                  <td class="num strong">${miles(p.st)}</td>
                  <td class="num" style="color:var(--ink-3)">${miles(p.min)}</td>
                  <td>${bar(p.st/(p.min*2))}</td>
                  <td class="num">${money(p.st*p.p)}</td>
                </tr>`).join("")}</tbody>
            </table></div></div>
          </div>`;
        document.getElementById("entrada").onclick=()=>drawer("Entrada de mercancía",`
          ${campo("Producto",`<select name="sku">${opciones(S.catalogo.map(p=>[p.sku,p.n]))}</select>`)}
          <div class="fc-row">${campo("Piezas recibidas",`<input name="q" type="number" min="1" required placeholder="50">`)}
          ${campo("Factura del proveedor",`<input name="fac" placeholder="F-2291">`)}</div>`,
          d=>{const p=find(d.sku); p.st+= +d.q; toast("+"+d.q+" pz de "+p.n+(d.fac?" · factura "+d.fac:""),"📦"); refrescar();},{enviar:"Registrar entrada"});
        document.getElementById("nuevo").onclick=()=>drawer("Nuevo producto",`
          ${campo("Nombre",`<input name="n" required placeholder="Taladro 1/2 pulg">`)}
          <div class="fc-row">${campo("Categoría",`<select name="cat">${opciones(["Construcción","Plomería","Eléctrico","Pintura","Herramienta"])}</select>`)}
          ${campo("Precio de venta",`<input name="p" type="number" min="1" required placeholder="890">`)}</div>
          <div class="fc-row">${campo("Existencia inicial",`<input name="st" type="number" min="0" value="0">`)}
          ${campo("Mínimo",`<input name="min" type="number" min="0" value="5">`)}</div>`,
          d=>{const pref={Construcción:"FER",Plomería:"PLO",Eléctrico:"ELE",Pintura:"PIN",Herramienta:"HER"}[d.cat];
            S.catalogo.push({sku:pref+"-"+(5000+S.catalogo.length),n:d.n,cat:d.cat,p:+d.p,st:+d.st,min:+d.min}); toast(d.n+" dado de alta","✅"); refrescar();});
      }
    }
  ]
};
startDemo(DEMO);
</script>
</body>
</html>
