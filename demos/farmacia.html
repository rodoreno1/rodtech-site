<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Farmacia San Miguel — Demo RodTech</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/demo.css">
</head>
<body>

<div class="demo-strip">
  <b>Demostración</b>
  <span class="sep">·</span>
  <span class="hide-sm">Sistema de ejemplo para una farmacia. Cobra en el punto de venta y mira cómo se actualizan inventario, pedidos y clientes.</span>
  <a href="../index.html#ideas">← Volver a RodTech</a>
</div>

<div class="app" id="app"></div>
<div id="toast"></div>

<script src="assets/demo.js"></script>
<script>
const hora = () => new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false});
let S = {
  seq: 47,
  lotes: [
    {n:"Amoxicilina 500 mg c/12",lote:"L-4471",dias:12,pz:24,anaquel:"B3",atendido:false},
    {n:"Jarabe infantil ambroxol",lote:"L-2231",dias:20,pz:9,anaquel:"A1",atendido:false},
    {n:"Naproxeno 250 mg c/10",lote:"L-8890",dias:34,pz:16,anaquel:"C2",atendido:false},
    {n:"Loratadina 10 mg c/10",lote:"L-1102",dias:58,pz:40,anaquel:"B1",atendido:false},
  ],
  stock: [
    {n:"Paracetamol 500 mg c/10",hay:6,  dia:4,  p:12.5, desc:0},
    {n:"Suero oral 625 ml",      hay:3,  dia:2,  p:18,   desc:0},
    {n:"Ibuprofeno 400 mg c/10", hay:19, dia:3,  p:15.8, desc:0},
    {n:"Vitamina C 1 g c/10",    hay:5,  dia:3,  p:22,   desc:0},
    {n:"Alcohol 250 ml",         hay:31, dia:2,  p:26,   desc:0},
    {n:"Amoxicilina 500 mg c/12",hay:24, dia:1,  p:68,   desc:0},
    {n:"Jarabe infantil ambroxol",hay:9, dia:1,  p:54,   desc:0},
    {n:"Naproxeno 250 mg c/10",  hay:16, dia:1,  p:19,   desc:0},
    {n:"Loratadina 10 mg c/10",  hay:40, dia:2,  p:24,   desc:0},
    {n:"Metformina 850 mg c/30", hay:14, dia:1,  p:48,   desc:0},
    {n:"Losartán 50 mg c/30",    hay:11, dia:1,  p:62,   desc:0},
    {n:"Omeprazol 20 mg c/14",   hay:17, dia:1,  p:35,   desc:0},
  ],
  clientes: [
    {n:"Jorge Ramírez",tel:"953 118 2201",trat:"Metformina 850 mg c/30",cada:30,ultimo:30,avisado:false},
    {n:"Carmen López",tel:"953 105 7742",trat:"Losartán 50 mg c/30",cada:30,ultimo:28,avisado:false},
    {n:"Familia Torres",tel:"953 132 0186",trat:"Vitamina C 1 g c/10",cada:21,ultimo:21,avisado:false},
    {n:"Paola Rueda",tel:"953 121 8830",trat:"Omeprazol 20 mg c/14",cada:30,ultimo:14,avisado:false},
  ],
  ventas: [
    {folio:"T-45",hora:"09:12",cliente:"Mostrador",items:{"Paracetamol 500 mg c/10":2,"Alcohol 250 ml":1},pago:"Efectivo"},
    {folio:"T-46",hora:"10:40",cliente:"Mostrador",items:{"Ibuprofeno 400 mg c/10":1,"Suero oral 625 ml":2},pago:"Tarjeta"},
  ],
  carrito: {},
  proveedor: "Droguería Nacional",
  pedidoPend: null,
};
const prod = n => S.stock.find(s=>s.n===n);
const precioDe = s => +(s.p*(1-(s.desc||0)/100)).toFixed(2);
const totalDe = items => Object.entries(items).reduce((t,[n,q])=>t+(prod(n)?precioDe(prod(n)):0)*q,0);
const piezas = () => Object.values(S.carrito).reduce((a,b)=>a+b,0);
const porVencer = () => S.lotes.filter(l=>!l.atendido && l.dias<=30);
const bajos = () => S.stock.filter(s=>s.hay < s.dia*5);
const sugerido = s => Math.max(0, Math.ceil(s.dia*10) - s.hay);
const totalPedido = () => bajos().reduce((t,s)=>t+sugerido(s)*s.p,0);
const tocan = () => S.clientes.filter(c=>!c.avisado && c.ultimo>=c.cada-2);
const iniciales = n => n.split(" ").map(w=>w[0]).slice(0,2).join("");
const ventasHoy = () => S.ventas.reduce((t,v)=>t+totalDe(v.items),0);

const ticketHTML = items => `${Object.entries(items).map(([n,q])=>`<div class="r"><span>${q}× ${esc(n)}${prod(n)&&prod(n).desc?` <span class="tag ok">−${prod(n).desc}%</span>`:""}</span><b>${money((prod(n)?precioDe(prod(n)):0)*q)}</b></div>`).join("")}
  <div class="r t"><span>Total</span><span>${money(totalDe(items))}</span></div>`;

const DEMO = {
  negocio:"Farmacia San Miguel", rubro:"Farmacia", emoji:"💊",
  estado:{clave:"farmacia", get:()=>S, set:o=>{S=o;}},
  secciones:[
    {
      id:"pos", nombre:"Punto de venta", ic:"🧾",
      titulo:"Punto de venta", sub:"Busca, cobra y el inventario se descuenta solo",
      badge:()=>piezas()||"",
      render(root, refrescar){
        root.innerHTML = `
          <div class="cols">
            <div class="panel">
              <div class="panel-h"><h2>Productos</h2><div class="right"><input class="field search" id="q" placeholder="🔍 Escribe el medicamento…"></div></div>
              <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
                <thead><tr><th>Producto</th><th class="num">Hay</th><th class="num">Precio</th><th class="num">Cant.</th></tr></thead>
                <tbody id="filas"></tbody></table></div></div>
            </div>
            <div class="panel">
              <div class="panel-h"><h2>Ticket</h2>${piezas()?`<div class="right"><button class="btn sm" id="vaciar">Vaciar</button></div>`:""}</div>
              <div class="panel-b" id="tk"></div>
            </div>
          </div>`;
        const pintarTk=()=>{const r=document.getElementById("tk");
          if(!piezas()){r.innerHTML=`<div class="empty"><div class="big">🧾</div><b>Ticket vacío</b><p>Agrega productos de la lista. Los que están en liquidación ya traen su descuento.</p></div>`;return;}
          r.innerHTML=`<div class="ticket">${ticketHTML(S.carrito)}</div><button class="btn primary" id="cobrar" style="width:100%;margin-top:12px">Cobrar ${money(totalDe(S.carrito))}</button>`;
          document.getElementById("cobrar").onclick=()=>drawer("Cobrar",`<div class="ticket">${ticketHTML(S.carrito)}</div>
            <div class="fc-row">${campo("Cliente",`<select name="cli">${opciones(["Mostrador",...S.clientes.map(c=>c.n)])}</select>`,"Si es cliente frecuente, se registra su surtido")}
            ${campo("Pago",`<select name="pago">${opciones(["Efectivo","Tarjeta","Transferencia"])}</select>`)}</div>`,
            d=>{const falta=Object.entries(S.carrito).find(([n,q])=>prod(n).hay<q);
              if(falta){toast("Solo hay "+prod(falta[0]).hay+" de "+falta[0],"⚠️");return false;}
              Object.entries(S.carrito).forEach(([n,q])=>{prod(n).hay-=q;});
              const v={folio:"T-"+(S.seq++),hora:hora(),cliente:d.cli,items:{...S.carrito},pago:d.pago};S.ventas.unshift(v);
              const c=S.clientes.find(x=>x.n===d.cli); if(c){c.ultimo=0;c.avisado=false;}
              toast(v.folio+" cobrado · "+money(totalDe(v.items))+(c?" · surtido de "+c.n+" registrado":""),"💵");
              S.carrito={}; refrescar();},{enviar:"Registrar venta"});
        };
        const filas=()=>{const q=(document.getElementById("q").value||"").toLowerCase();const lista=S.stock.filter(s=>s.n.toLowerCase().includes(q));
          document.getElementById("filas").innerHTML=lista.length?lista.map(s=>`<tr>
            <td><b>${esc(s.n)}</b>${s.desc?` <span class="tag ok">liquidación −${s.desc}%</span>`:""}</td>
            <td class="num">${s.hay<s.dia*5?`<span class="tag ${s.hay?"warn":"bad"}">${s.hay}</span>`:s.hay}</td>
            <td class="num strong">${money(precioDe(s))}</td>
            <td class="num" style="white-space:nowrap"><button class="btn sm" data-m="${esc(s.n)}">−</button>
              <b style="display:inline-block;min-width:26px;text-align:center">${S.carrito[s.n]||0}</b>
              <button class="btn sm" data-p="${esc(s.n)}" ${s.hay<=(S.carrito[s.n]||0)?"disabled":""}>+</button></td></tr>`).join("")
            :`<tr><td colspan="4"><div class="empty"><b>Sin resultados</b></div></td></tr>`;
          document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{S.carrito[b.dataset.p]=(S.carrito[b.dataset.p]||0)+1;guardarEstado(DEMO);filas();pintarTk();});
          document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{const k=b.dataset.m;if(S.carrito[k]){S.carrito[k]--;if(!S.carrito[k])delete S.carrito[k];}guardarEstado(DEMO);filas();pintarTk();});
        };
        filas();pintarTk();document.getElementById("q").oninput=filas;
        const v=document.getElementById("vaciar");if(v)v.onclick=()=>{S.carrito={};refrescar();};
      }
    },
    {
      id:"panel", nombre:"Panel", ic:"📊",
      titulo:"Resumen del día", sub:"Lo que necesitas saber al abrir la cortina",
      render(root){
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><div class="lbl">Ventas hoy</div><div class="val">${money(ventasHoy())}</div><div class="delta flat">${S.ventas.length} tickets</div></div>
            <div class="kpi"><div class="lbl">Ticket promedio</div><div class="val">${money(S.ventas.length?ventasHoy()/S.ventas.length:0)}</div><div class="delta flat">por venta</div></div>
            <div class="kpi"><div class="lbl">Lotes por vencer</div><div class="val">${porVencer().length}</div><div class="delta ${porVencer().length?"down":"up"}">${porVencer().length?"requieren acción":"al corriente"}</div></div>
            <div class="kpi"><div class="lbl">Productos bajos</div><div class="val">${bajos().length}</div><div class="delta flat">de ${S.stock.length} vigilados</div></div>
          </div>
          ${porVencer().length?`<div class="note bad"><span class="ic">⏰</span><div>
            <b>${porVencer().length} lotes caducan en menos de 30 días</b>
            <span>Vale ${money(porVencer().reduce((t,l)=>t+l.pz*(prod(l.n)?prod(l.n).p:35),0))} en producto. Ve a Caducidades para liquidarlo o devolverlo.</span></div></div>`:""}
          ${S.pedidoPend?`<div class="note info"><span class="ic">🚚</span><div><b>${esc(S.pedidoPend.folio)} en camino</b><span>${esc(S.pedidoPend.prov)} · entrega ${esc(S.pedidoPend.eta)}. Márcalo recibido en Pedido cuando llegue.</span></div></div>`:""}
          <div class="cols">
            <div class="panel">
              <div class="panel-h"><h2>Ventas por día</h2><span class="sub">Últimos 7 días</span></div>
              <div class="panel-b">${chart([
                {k:"Lun",v:6100},{k:"Mar",v:5800},{k:"Mié",v:7200},{k:"Jue",v:6900},
                {k:"Vie",v:9100},{k:"Sáb",v:8700},{k:"Hoy",v:Math.max(ventasHoy(),300),hi:true}])}</div>
            </div>
            <div class="panel">
              <div class="panel-h"><h2>Clientes por surtir</h2><span class="sub">${tocan().length} esta semana</span></div>
              <div class="panel-b flush"><table class="tbl"><tbody>
                ${tocan().length?tocan().map(c=>`<tr>
                  <td><div class="cellmain"><div class="em">${iniciales(c.n)}</div>
                    <div><b>${esc(c.n)}</b><span>${esc(c.trat)} · hace ${c.ultimo} días</span></div></div></td>
                </tr>`).join(""):`<tr><td><div class="empty"><b>Nadie pendiente</b><p>Todos avisados o surtidos.</p></div></td></tr>`}
              </tbody></table></div>
            </div>
          </div>`;
      }
    },
    {
      id:"caducidades", nombre:"Caducidades", ic:"⏰",
      titulo:"Control de caducidades", sub:"El sistema revisa cada lote todos los días para que no pierdas producto",
      badge:()=>porVencer().length||"",
      accion:{txt:"+ Registrar lote", fn:(refrescar)=>drawer("Nuevo lote",`
          ${campo("Producto",`<select name="n">${opciones(S.stock.map(s=>s.n))}</select>`)}
          <div class="fc-row">${campo("Lote",`<input name="lote" required placeholder="L-5120">`)}
          ${campo("Anaquel",`<input name="an" value="A1">`)}</div>
          <div class="fc-row">${campo("Piezas",`<input name="pz" type="number" min="1" required placeholder="12">`)}
          ${campo("Caduca en (días)",`<input name="dias" type="number" min="1" required placeholder="90">`)}</div>`,
        d=>{S.lotes.push({n:d.n,lote:d.lote,dias:+d.dias,pz:+d.pz,anaquel:d.an,atendido:false});S.lotes.sort((a,b)=>a.dias-b.dias);
          if(prod(d.n))prod(d.n).hay+= +d.pz; toast("Lote "+d.lote+" registrado · +"+d.pz+" pz en inventario","✅");refrescar();})},
      render(root, refrescar){
        const pend = S.lotes.filter(l=>!l.atendido);
        root.innerHTML = `
          <div class="panel">
            <div class="panel-h"><h2>Lotes vigilados</h2><span class="sub">Ordenados por urgencia</span></div>
            <div class="panel-b flush">${pend.length?`<div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Medicamento</th><th>Lote</th><th>Anaquel</th><th class="num">Piezas</th><th>Caduca en</th><th></th></tr></thead>
              <tbody>${pend.map(l=>`
                <tr>
                  <td><b>${esc(l.n)}</b></td>
                  <td style="color:var(--ink-3)">${esc(l.lote)}</td>
                  <td><span class="tag neutral">${esc(l.anaquel)}</span></td>
                  <td class="num strong">${l.pz}</td>
                  <td><span class="tag ${l.dias<=15?"bad":l.dias<=30?"warn":"ok"}">${l.dias} días</span></td>
                  <td class="num" style="white-space:nowrap">
                    <button class="btn sm" data-liq="${S.lotes.indexOf(l)}">Liquidar</button>
                    <button class="btn sm" data-dev="${S.lotes.indexOf(l)}">Devolver</button></td>
                </tr>`).join("")}</tbody></table></div>`
              :`<div class="empty"><div class="big">🌟</div><b>Todo atendido</b>
                <p>Ningún lote pendiente. El sistema seguirá revisando cada día por ti.</p></div>`}
            </div>
          </div>`;
        root.querySelectorAll("[data-liq]").forEach(b=>b.onclick=()=>{
          const l=S.lotes[+b.dataset.liq];
          drawer("Liquidar "+l.lote,`<p style="font-size:.9rem;color:var(--ink-2)">${esc(l.n)} · ${l.pz} piezas · caduca en ${l.dias} días</p>
            ${campo("Descuento en punto de venta",`<select name="d">${opciones([["20","20%"],["30","30%"],["50","50%"]],"30")}</select>`,"El precio cambia al instante en el punto de venta")}`,
            d=>{l.atendido=true; if(prod(l.n)) prod(l.n).desc=+d.d; toast(l.n+" con "+d.d+"% de descuento en el punto de venta","🏷️"); refrescar();},{enviar:"Aplicar"});
        });
        root.querySelectorAll("[data-dev]").forEach(b=>b.onclick=()=>{
          const l=S.lotes[+b.dataset.dev]; l.atendido=true; if(prod(l.n)) prod(l.n).hay=Math.max(0,prod(l.n).hay-l.pz);
          toast("Devolución de "+l.pz+" pz de "+l.n+" solicitada a la droguería","📦"); refrescar(); });
      }
    },
    {
      id:"pedido", nombre:"Pedido", ic:"🚚",
      titulo:"Pedido a droguería", sub:"Calculado con la rotación real de los últimos 30 días",
      badge:()=>S.pedidoPend?"1":(bajos().length||""),
      render(root, refrescar){
        root.innerHTML = `
          ${S.pedidoPend?`<div class="note info"><span class="ic">🚚</span><div style="flex:1"><b>${esc(S.pedidoPend.folio)} en camino · ${esc(S.pedidoPend.prov)}</b>
            <span>${S.pedidoPend.lineas.map(l=>l.q+"× "+esc(l.n)).join(", ")} · entrega ${esc(S.pedidoPend.eta)}</span>
            <div style="margin-top:9px"><button class="btn sm primary" id="recibir">Marcar recibido y sumar al inventario</button></div></div></div>`
          :`<div class="note info"><span class="ic">🤖</span><div>
            <b>Sugerencia automática</b>
            <span>Se pide lo necesario para 10 días de venta según lo que realmente se mueve. Puedes ajustar cualquier cantidad antes de enviar.</span></div></div>`}
          <div class="panel">
            <div class="panel-h"><h2>Proveedor</h2>
              <div class="right">${["Droguería Nacional","Farmapronto"].map(p=>
                `<button class="btn sm ${p===S.proveedor?"primary":""}" data-prov="${esc(p)}">${esc(p)}</button>`).join("")}</div></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Producto</th><th class="num">Hay</th><th class="num">Venta diaria</th><th class="num">Sugerido</th><th class="num">Importe</th></tr></thead>
              <tbody>${bajos().length?bajos().map(s=>`
                <tr>
                  <td><b>${esc(s.n)}</b></td>
                  <td class="num"><span class="tag ${s.hay<s.dia*3?"bad":"warn"}">${s.hay}</span></td>
                  <td class="num" style="color:var(--ink-3)">${s.dia} pz</td>
                  <td class="num strong">${sugerido(s)}</td>
                  <td class="num">${money(sugerido(s)*s.p)}</td>
                </tr>`).join(""):`<tr><td colspan="5"><div class="empty"><div class="big">👌</div>
                  <b>Nada por pedir</b><p>Todo el inventario vigilado está por encima del mínimo.</p></div></td></tr>`}</tbody>
              ${bajos().length?`<tfoot><tr><td colspan="4" class="num strong">Total del pedido</td>
                <td class="num strong">${money(totalPedido())}</td></tr></tfoot>`:""}
            </table></div></div>
          </div>
          ${bajos().length&&!S.pedidoPend?`<button class="btn primary" id="enviarPedido">Revisar y enviar a ${esc(S.proveedor)}</button>`:""}`;
        root.querySelectorAll("[data-prov]").forEach(b=>b.onclick=()=>{ S.proveedor=b.dataset.prov; refrescar(); });
        const e = document.getElementById("enviarPedido");
        if(e) e.onclick=()=>drawer("Pedido a "+S.proveedor,`${campo("Cantidades",`<div class="pick">${bajos().map((s,i)=>`
            <label><b>${esc(s.n)}</b><span>${money(s.p)} c/u</span><input type="number" name="q_${i}" value="${sugerido(s)}" min="0" max="500"></label>`).join("")}</div>`,"Ajusta si quieres pedir más o menos")}`,
          d=>{const lineas=bajos().map((s,i)=>({n:s.n,q:parseInt(d["q_"+i]||"0",10)})).filter(l=>l.q>0);
            if(!lineas.length){toast("Captura al menos una cantidad","⚠️");return false;}
            S.pedidoPend={folio:"PED-"+Math.floor(4400+Math.random()*100),prov:S.proveedor,lineas,eta:S.proveedor==="Droguería Nacional"?"mañana antes de las 9:00":"hoy antes de las 18:00"};
            toast(S.pedidoPend.folio+" enviado · entrega "+S.pedidoPend.eta,"🚚"); refrescar();},{enviar:"Enviar pedido"});
        const r=document.getElementById("recibir");
        if(r) r.onclick=()=>{S.pedidoPend.lineas.forEach(l=>{if(prod(l.n))prod(l.n).hay+=l.q;});toast(S.pedidoPend.folio+" recibido · inventario actualizado","📦");S.pedidoPend=null;refrescar();};
      }
    },
    {
      id:"clientes", nombre:"Clientes", ic:"👥",
      titulo:"Clientes frecuentes", sub:"Quién surte qué y cada cuánto, para recordarles a tiempo",
      badge:()=>tocan().length||"",
      accion:{txt:"+ Nuevo cliente", fn:(refrescar)=>drawer("Nuevo cliente frecuente",`
          ${campo("Nombre",`<input name="n" required placeholder="María Sánchez">`)}
          ${campo("WhatsApp",`<input name="tel" required placeholder="953 000 0000">`)}
          ${campo("Tratamiento",`<select name="trat">${opciones(S.stock.map(s=>s.n))}</select>`)}
          ${campo("Surte cada",`<select name="cada">${opciones([["7","7 días"],["14","14 días"],["21","21 días"],["30","30 días"]],"30")}</select>`)}`,
        d=>{S.clientes.push({n:d.n,tel:d.tel,trat:d.trat,cada:+d.cada,ultimo:0,avisado:false});toast(d.n+" dado de alta · le recordaremos en "+d.cada+" días","✅");refrescar();})},
      render(root, refrescar){
        root.innerHTML = `
          <div class="panel">
            <div class="panel-h"><h2>Tratamientos en seguimiento</h2>
              <div class="right"><input class="field search" id="q" placeholder="🔍 Buscar cliente…"></div></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Cliente</th><th>Tratamiento</th><th>Frecuencia</th><th>Último surtido</th><th></th></tr></thead>
              <tbody id="filas"></tbody></table></div></div>
          </div>`;
        const filas = () => {
          const q=(document.getElementById("q").value||"").toLowerCase();
          const lista = S.clientes.filter(c=>c.n.toLowerCase().includes(q));
          document.getElementById("filas").innerHTML = lista.length?lista.map(c=>{
            const toca = c.ultimo>=c.cada-2;
            return `<tr>
              <td><div class="cellmain"><div class="em">${iniciales(c.n)}</div>
                <div><b>${esc(c.n)}</b><span>📞 ${esc(c.tel)}</span></div></div></td>
              <td>${esc(c.trat)}</td>
              <td style="color:var(--ink-3)">cada ${c.cada} días</td>
              <td>${toca?`<span class="tag warn">hace ${c.ultimo} días</span>`:`<span style="color:var(--ink-3)">${c.ultimo?"hace "+c.ultimo+" días":"hoy"}</span>`}</td>
              <td class="num"><div class="actions" style="justify-content:flex-end">
                ${c.avisado?`<span class="tag ok">Recordado ✓</span>`:toca?`<button class="btn sm primary" data-rec="${S.clientes.indexOf(c)}">Recordar por WhatsApp</button>`:""}
                <button class="btn sm" data-sur="${S.clientes.indexOf(c)}">Surtir ahora</button></div></td>
            </tr>`;}).join(""):`<tr><td colspan="5"><div class="empty"><b>Sin resultados</b></div></td></tr>`;
          document.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{
            const c=S.clientes[+b.dataset.rec]; c.avisado=true;
            toast("Recordatorio enviado a "+c.n+" al "+c.tel,"📲"); refrescar(); });
          document.querySelectorAll("[data-sur]").forEach(b=>b.onclick=()=>{
            const c=S.clientes[+b.dataset.sur]; S.carrito={}; if(prod(c.trat)&&prod(c.trat).hay) S.carrito[c.trat]=1;
            toast("Ticket preparado con "+c.trat+" · cóbralo aquí","🧾"); DEMO.ir("pos"); });
        };
        filas();
        document.getElementById("q").oninput = filas;
      }
    }
  ]
};
startDemo(DEMO);
</script>
</body>
</html>
