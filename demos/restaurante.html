<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>La Cocina de Rosa — Demo RodTech</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/demo.css">
</head>
<body>

<div class="demo-strip">
  <b>Demostración</b>
  <span class="sep">·</span>
  <span class="hide-sm">Sistema de ejemplo para un restaurante. Captura comandas, cóbralas y mira cómo se mueven insumos y reportes.</span>
  <a href="../index.html#ideas">← Volver a RodTech</a>
</div>

<div class="app" id="app"></div>
<div id="toast"></div>

<script src="assets/demo.js"></script>
<script>
/* ---------------- Estado (se guarda en el navegador) ---------------- */
const hora = () => new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false});
let S = {
  seq: 49,
  mesas: ["Mesa 1","Mesa 2","Mesa 3","Mesa 4","Mesa 5","Mesa 6","Barra 1","Barra 2","Para llevar"],
  mozos: ["Lupita","Beto","Sofi"],
  comandas: [
    {id:48, mesa:"Mesa 4", mozo:"Lupita", hora:"14:12", estado:"cocina",  items:[["Tacos de pastor (orden)",2],["Agua del día 1L",1]], nota:"Sin cebolla", pagada:false},
    {id:47, mesa:"Mesa 6", mozo:"Beto",   hora:"14:05", estado:"cocina",  items:[["Enchiladas verdes",3],["Refresco",3]], nota:"", pagada:false},
    {id:46, mesa:"Barra 2",mozo:"Lupita", hora:"13:58", estado:"listo",   items:[["Hamburguesa de la casa",1],["Limonada mineral",1]], nota:"Término tres cuartos", pagada:false},
    {id:45, mesa:"Mesa 1", mozo:"Sofi",   hora:"13:40", estado:"servido", items:[["Mole de la abuela",2],["Café de olla",2]], nota:"", pagada:true, pago:"Tarjeta", tip:10},
  ],
  menu: [
    {e:"🌮",n:"Tacos de pastor (orden)",cat:"Platillos",p:95, activo:true, usa:{"Carne al pastor":0.3,"Tortilla de maíz":0.15,"Piña":0.1}},
    {e:"🥘",n:"Enchiladas verdes",cat:"Platillos",p:110, activo:true, usa:{"Tortilla de maíz":0.15,"Queso fresco":0.1}},
    {e:"🍔",n:"Hamburguesa de la casa",cat:"Platillos",p:145, activo:true, usa:{"Carne al pastor":0.2}},
    {e:"🍗",n:"Mole de la abuela",cat:"Platillos",p:125, activo:false, usa:{}},
    {e:"🥗",n:"Ensalada César",cat:"Platillos",p:98, activo:true, usa:{"Aguacate":0.2}},
    {e:"🍹",n:"Agua del día 1L",cat:"Bebidas",p:45, activo:true, usa:{}},
    {e:"🥤",n:"Refresco",cat:"Bebidas",p:30, activo:true, usa:{}},
    {e:"☕",n:"Café de olla",cat:"Bebidas",p:38, activo:true, usa:{}},
    {e:"🍋",n:"Limonada mineral",cat:"Bebidas",p:42, activo:true, usa:{}},
    {e:"🍮",n:"Flan napolitano",cat:"Postres",p:55, activo:true, usa:{}},
  ],
  insumos: [
    {n:"Carne al pastor",u:"kg", hay:8,  min:12, prov:"Carnes del Valle"},
    {n:"Tortilla de maíz",u:"kg", hay:22, min:15, prov:"Tortillería Aurora"},
    {n:"Queso fresco",u:"kg", hay:3,  min:6,  prov:"Lácteos San José"},
    {n:"Aguacate",u:"kg", hay:14, min:10, prov:"Central de Abastos"},
    {n:"Piña",u:"pza", hay:4,  min:8,  prov:"Central de Abastos"},
  ],
  ventasPrevias: 48290,
};
const plato = n => S.menu.find(m=>m.n===n);
const precio = n => (plato(n) ? plato(n).p : 0);
const totalCom = c => c.items.reduce((s,[n,q])=>s+precio(n)*q,0);
const bajos = () => S.insumos.filter(i=>i.hay < i.min);
const abiertas = () => S.comandas.filter(c=>c.estado!=="servido");
const porCobrar = () => S.comandas.filter(c=>c.estado==="servido" && !c.pagada);
const ventasHoy = () => S.comandas.filter(c=>c.pagada).reduce((s,c)=>s+totalCom(c),0);
const vendidos = n => S.comandas.reduce((s,c)=>s+c.items.filter(([x])=>x===n).reduce((a,[,q])=>a+q,0),0);

function descontarInsumos(items){
  items.forEach(([n,q])=>{const m=plato(n); if(!m) return;
    Object.entries(m.usa).forEach(([ins,cant])=>{const i=S.insumos.find(x=>x.n===ins); if(i) i.hay=Math.max(0,+(i.hay-cant*q).toFixed(2));});});
}

/* ---------------- Flujo principal: nueva comanda ---------------- */
function nuevaComanda(refrescar){
  const activos = S.menu.filter(m=>m.activo);
  drawer("Nueva comanda", `
    <div class="fc-row">
      ${campo("Mesa",`<select name="mesa">${opciones(S.mesas)}</select>`)}
      ${campo("Mesero",`<select name="mozo">${opciones(S.mozos)}</select>`)}
    </div>
    ${campo("Platillos",`<div class="pick">${activos.map((m,i)=>`
      <label><input type="checkbox" name="it_${i}" value="1"><b>${m.e} ${esc(m.n)}</b><span>${money(m.p)}</span>
      <input type="number" name="q_${i}" value="1" min="1" max="20"></label>`).join("")}</div>`,"Marca los platillos y ajusta la cantidad")}
    ${campo("Nota para cocina",`<input name="nota" placeholder="Sin cebolla, salsa aparte…">`)}
  `, d=>{
    const items=[];activos.forEach((m,i)=>{ if(d["it_"+i]) items.push([m.n, Math.max(1,parseInt(d["q_"+i]||"1",10))]); });
    if(!items.length){ toast("Marca al menos un platillo","⚠️"); return false; }
    const c={id:S.seq++, mesa:d.mesa, mozo:d.mozo, hora:hora(), estado:"cocina", items, nota:d.nota, pagada:false};
    S.comandas.unshift(c); descontarInsumos(items);
    toast("Comanda #"+c.id+" enviada a cocina · "+money(totalCom(c)),"👨‍🍳"); refrescar();
  },{enviar:"Enviar a cocina"});
}

function cobrar(c, refrescar){
  const sub=totalCom(c);
  drawer("Cobrar comanda #"+c.id,`
    <div class="ticket">${c.items.map(([n,q])=>`<div class="r"><span>${q}× ${esc(n)}</span><span>${money(precio(n)*q)}</span></div>`).join("")}
      <div class="r t"><span>Total</span><span>${money(sub)}</span></div></div>
    <div class="fc-row">${campo("Forma de pago",`<select name="pago">${opciones(["Efectivo","Tarjeta","Transferencia"])}</select>`)}
    ${campo("Propina",`<select name="tip">${opciones([["0","Sin propina"],["10","10%"],["15","15%"]],"10")}</select>`)}</div>`,
    d=>{ c.pagada=true; c.pago=d.pago; c.tip=+d.tip; toast("Cuenta #"+c.id+" cobrada · "+money(sub*(1+c.tip/100))+" ("+d.pago.toLowerCase()+")","💵"); refrescar(); },{enviar:"Registrar pago"});
}
function ticket(c){
  const sub=totalCom(c), tip=Math.round(sub*(c.tip||0)/100);
  drawer("Ticket #"+c.id,`<div class="ticket">
    <div class="r"><b>LA COCINA DE ROSA</b><span>${c.hora}</span></div><div class="r"><span>${esc(c.mesa)} · ${esc(c.mozo)}</span><span>${new Date().toLocaleDateString("es-MX")}</span></div>
    <div style="height:8px"></div>${c.items.map(([n,q])=>`<div class="r"><span>${q}× ${esc(n)}</span><span>${money(precio(n)*q)}</span></div>`).join("")}
    <div class="r t"><span>Subtotal</span><span>${money(sub)}</span></div>${tip?`<div class="r"><span>Propina ${c.tip}%</span><span>${money(tip)}</span></div>`:""}
    <div class="r t"><span>TOTAL</span><span>${money(sub+tip)}</span></div><div class="r"><span>Pago</span><span>${esc(c.pago||"Efectivo")}</span></div></div>`,
    ()=>toast("Ticket enviado a la impresora de caja","🧾"),{enviar:"Imprimir"});
}

/* ---------------- Demo ---------------- */
const DEMO = {
  negocio:"La Cocina de Rosa", rubro:"Restaurante", emoji:"🍽️",
  estado:{clave:"restaurante", get:()=>S, set:o=>{S=o;}},
  secciones:[
    {
      id:"comandas", nombre:"Comandas", ic:"🔔",
      titulo:"Comandas", sub:"Lo que la cocina está viendo ahora mismo",
      badge:()=>abiertas().length,
      accion:{txt:"+ Nueva comanda", fn:nuevaComanda},
      render(root, refrescar){
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><div class="lbl">Cobrado hoy</div><div class="val">${money(ventasHoy())}</div><div class="delta flat">${S.comandas.filter(c=>c.pagada).length} cuentas cerradas</div></div>
            <div class="kpi"><div class="lbl">Comandas abiertas</div><div class="val">${abiertas().length}</div><div class="delta flat">en cocina o por servir</div></div>
            <div class="kpi"><div class="lbl">Por cobrar</div><div class="val">${money(porCobrar().reduce((s,c)=>s+totalCom(c),0))}</div><div class="delta ${porCobrar().length?"down":"flat"}">${porCobrar().length} mesas servidas sin cerrar</div></div>
            <div class="kpi"><div class="lbl">Insumos bajos</div><div class="val">${bajos().length}</div><div class="delta ${bajos().length?"down":"up"}">${bajos().length?"revisa Insumos":"todo en orden"}</div></div>
          </div>
          <div class="panel">
            <div class="panel-h"><h2>Órdenes del turno</h2><span class="sub">Cada comanda nueva descuenta insumos automáticamente</span></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Comanda</th><th>Platillos</th><th>Estado</th><th class="num">Total</th><th></th></tr></thead>
              <tbody>${S.comandas.map(c=>`
                <tr>
                  <td><div class="cellmain"><div class="em">#${c.id}</div>
                    <div><b>${esc(c.mesa)}</b><span>${esc(c.mozo)} · ${c.hora}</span></div></div></td>
                  <td>${c.items.map(([n,q])=>`${q}× ${esc(n)}`).join("<br>")}
                    ${c.nota?`<br><span style="color:var(--warn);font-size:.82rem">📝 ${esc(c.nota)}</span>`:""}</td>
                  <td><span class="tag ${c.pagada?"neutral":c.estado==="cocina"?"warn":c.estado==="listo"?"info":"ok"}">
                    ${c.pagada?"Cobrada":c.estado==="cocina"?"En cocina":c.estado==="listo"?"Lista":"Servida"}</span></td>
                  <td class="num strong">${money(totalCom(c))}</td>
                  <td class="num"><div class="actions" style="justify-content:flex-end">
                    ${c.estado==="cocina"?`<button class="btn sm" data-av="${c.id}">Marcar lista</button>`:""}
                    ${c.estado==="listo"?`<button class="btn sm" data-av="${c.id}">Marcar servida</button>`:""}
                    ${c.estado==="servido"&&!c.pagada?`<button class="btn sm primary" data-cobrar="${c.id}">Cobrar</button>`:""}
                    ${c.pagada?`<button class="btn sm" data-tk="${c.id}">Ticket</button>`:""}
                  </div></td>
                </tr>`).join("")}</tbody>
            </table></div></div>
          </div>`;
        root.querySelectorAll("[data-av]").forEach(b=>b.onclick=()=>{
          const c=S.comandas.find(x=>x.id==b.dataset.av);
          c.estado = c.estado==="cocina"?"listo":"servido";
          toast("Comanda #"+c.id+(c.estado==="listo"?" lista para servir":" servida"),"🍽️"); refrescar();
        });
        root.querySelectorAll("[data-cobrar]").forEach(b=>b.onclick=()=>cobrar(S.comandas.find(x=>x.id==b.dataset.cobrar), refrescar));
        root.querySelectorAll("[data-tk]").forEach(b=>b.onclick=()=>ticket(S.comandas.find(x=>x.id==b.dataset.tk)));
      }
    },
    {
      id:"menu", nombre:"Menú", ic:"📖",
      titulo:"Menú digital", sub:"Lo que cambies aquí se ve al instante en el código QR de las mesas",
      accion:{txt:"+ Nuevo platillo", fn:(refrescar)=>drawer("Nuevo platillo",`
          ${campo("Nombre",`<input name="n" required placeholder="Chilaquiles verdes">`)}
          <div class="fc-row">${campo("Categoría",`<select name="cat">${opciones(["Platillos","Bebidas","Postres"])}</select>`)}
          ${campo("Precio",`<input name="p" type="number" min="1" step="1" required placeholder="85">`)}</div>
          ${campo("Emoji",`<input name="e" value="🍽️" maxlength="4">`)}`,
        d=>{ if(S.menu.some(m=>m.n.toLowerCase()===d.n.toLowerCase())){toast("Ese platillo ya existe","⚠️");return false;}
          S.menu.push({e:d.e||"🍽️",n:d.n,cat:d.cat,p:+d.p,activo:true,usa:{}}); toast(d.n+" agregado al menú","✅"); refrescar(); })},
      render(root, refrescar){
        root.innerHTML = `
          <div class="note info"><span class="ic">📱</span><div><b>Tus clientes ven este menú al escanear el QR de su mesa</b>
            <span>Marcar un platillo como agotado lo oculta de inmediato y deja de aparecer en Nueva comanda</span></div></div>
          <div class="panel">
            <div class="panel-h"><h2>Platillos y bebidas</h2><div class="right"><input class="field search" id="q" placeholder="🔍 Buscar…"></div></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Platillo</th><th>Categoría</th><th class="num">Precio</th><th class="num">Vendidos hoy</th><th>Disponible</th></tr></thead>
              <tbody id="filas"></tbody></table></div></div></div>`;
        const filas=()=>{const q=(document.getElementById("q").value||"").toLowerCase();const lista=S.menu.filter(m=>m.n.toLowerCase().includes(q));
          document.getElementById("filas").innerHTML=lista.length?lista.map(m=>`
            <tr><td><div class="cellmain"><div class="em">${m.e}</div><div><b>${esc(m.n)}</b></div></div></td>
              <td><span class="tag neutral">${esc(m.cat)}</span></td>
              <td class="num strong">${money(m.p)}</td><td class="num">${vendidos(m.n)}</td>
              <td><button class="btn sm ${m.activo?"":"primary"}" data-tog="${S.menu.indexOf(m)}">${m.activo?"Activo ✓":"Agotado"}</button></td></tr>`).join("")
            :`<tr><td colspan="5"><div class="empty"><b>Sin resultados</b></div></td></tr>`;
          document.querySelectorAll("[data-tog]").forEach(b=>b.onclick=()=>{const m=S.menu[+b.dataset.tog];m.activo=!m.activo;
            toast(m.activo?m.n+" vuelve al menú":m.n+" marcado como agotado",m.activo?"✅":"🚫");guardarEstado(DEMO);filas();});};
        filas();document.getElementById("q").oninput=filas;
      }
    },
    {
      id:"insumos", nombre:"Insumos", ic:"📦",
      titulo:"Control de insumos", sub:"Cada comanda descuenta lo que usa; el sistema avisa antes de que falte",
      badge:()=>bajos().length||"",
      accion:{txt:"Generar pedido a proveedores", fn:(refrescar)=>{
        if(!bajos().length){ toast("No hay insumos por debajo del mínimo","👌"); return; }
        const prov=[...new Set(bajos().map(i=>i.prov))];
        drawer("Pedido a proveedores",`<p style="font-size:.9rem;color:var(--ink-2)">Se pedirá lo necesario para volver a 1.5× el mínimo:</p>
          <div class="ticket">${bajos().map(i=>`<div class="r"><span>${esc(i.n)} · ${esc(i.prov)}</span><b>+${(i.min*1.5-i.hay).toFixed(1)} ${i.u}</b></div>`).join("")}</div>`,
          ()=>{ bajos().forEach(i=>{ i.hay=+(i.min*1.5).toFixed(1); }); toast("Pedido enviado a "+prov.length+" proveedor(es)","🚚"); refrescar(); },{enviar:"Confirmar pedido"});
      }},
      render(root, refrescar){
        root.innerHTML = `
          <div class="panel">
            <div class="panel-h"><h2>Existencias</h2><div class="right"><button class="btn sm" id="entrada">+ Registrar entrada</button></div></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Insumo</th><th>Proveedor</th><th class="num">Hay</th><th class="num">Mínimo</th><th style="width:180px">Nivel</th></tr></thead>
              <tbody>${S.insumos.map(i=>`<tr>
                  <td><b>${esc(i.n)}</b></td><td style="color:var(--ink-3)">${esc(i.prov)}</td>
                  <td class="num strong">${i.hay} ${i.u}</td><td class="num" style="color:var(--ink-3)">${i.min} ${i.u}</td>
                  <td>${bar(i.hay/(i.min*2))}${i.hay<i.min?`<span class="tag bad" style="margin-top:6px">Pedir ya</span>`:""}</td></tr>`).join("")}</tbody>
            </table></div></div></div>`;
        document.getElementById("entrada").onclick=()=>drawer("Entrada de mercancía",`
          ${campo("Insumo",`<select name="n">${opciones(S.insumos.map(i=>i.n))}</select>`)}
          ${campo("Cantidad recibida",`<input name="q" type="number" min="0.1" step="0.1" required placeholder="10">`)}`,
          d=>{const i=S.insumos.find(x=>x.n===d.n); i.hay=+(i.hay+ +d.q).toFixed(1); toast("+"+d.q+" "+i.u+" de "+i.n,"📦"); refrescar();},{enviar:"Registrar"});
      }
    },
    {
      id:"reportes", nombre:"Reportes", ic:"📊",
      titulo:"Cómo va el negocio", sub:"Calculado con las comandas reales de este demo",
      render(root){
        const top=[...S.menu].map(m=>({...m,v:vendidos(m.n)})).sort((a,b)=>b.v-a.v).slice(0,5);
        const hoy=ventasHoy();
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><div class="lbl">Ventas de la semana</div><div class="val">${money(S.ventasPrevias+hoy)}</div><div class="delta up">hoy llevas ${money(hoy)}</div></div>
            <div class="kpi"><div class="lbl">Comandas del turno</div><div class="val">${S.comandas.length}</div><div class="delta flat">${abiertas().length} abiertas</div></div>
            <div class="kpi"><div class="lbl">Ticket promedio</div><div class="val">${money(S.comandas.length?Math.round(S.comandas.reduce((s,c)=>s+totalCom(c),0)/S.comandas.length):0)}</div><div class="delta flat">por comanda</div></div>
            <div class="kpi"><div class="lbl">Platillo estrella</div><div class="val" style="font-size:1.15rem">${top[0]?esc(top[0].n):"—"}</div><div class="delta flat">${top[0]?top[0].v+" órdenes":""}</div></div>
          </div>
          <div class="cols">
            <div class="panel"><div class="panel-h"><h2>Ventas por día</h2><span class="sub">Últimos 7 días</span></div>
              <div class="panel-b">${chart([{k:"Lun",v:4200},{k:"Mar",v:3800},{k:"Mié",v:5100},{k:"Jue",v:6300},{k:"Vie",v:8900},{k:"Sáb",v:11400},{k:"Hoy",v:Math.max(hoy,800),hi:true}])}</div></div>
            <div class="panel"><div class="panel-h"><h2>Más vendidos hoy</h2></div>
              <div class="panel-b flush"><table class="tbl"><tbody>${top.map(m=>`<tr>
                  <td><div class="cellmain"><div class="em">${m.e}</div><div><b>${esc(m.n)}</b><span>${m.v} órdenes</span></div></div></td>
                  <td class="num strong">${money(m.v*m.p)}</td></tr>`).join("")}</tbody></table></div></div>
          </div>`;
      }
    }
  ]
};
startDemo(DEMO);
</script>
</body>
</html>
