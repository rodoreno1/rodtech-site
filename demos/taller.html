<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Taller Rodríguez — Demo RodTech</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/demo.css">
</head>
<body>

<div class="demo-strip">
  <b>Demostración</b>
  <span class="sep">·</span>
  <span class="hide-sm">Sistema de ejemplo para un taller mecánico. Abre una orden, agrega trabajos extra, entrega y cobra.</span>
  <a href="../index.html#ideas">← Volver a RodTech</a>
</div>

<div class="app" id="app"></div>
<div id="toast"></div>

<script src="assets/demo.js"></script>
<script>
const hora = () => new Date().toLocaleTimeString("es-MX",{hour:"2-digit",minute:"2-digit",hour12:false});
let S = {
  seq: 1043, ingresosMes: 68400,
  servicios: [["Cambio de aceite y filtro",650],["Afinación menor",1450],["Afinación mayor",1850],["Cambio de balatas delanteras",1250],["Rectificado de discos",600],["Diagnóstico electrónico",450],["Revisión de frenos",350],["Servicio de clima",900],["Alineación y balanceo",550]],
  mecanicos: ["Chuy","Lalo"],
  ordenes: [
    {folio:"A-1042",cliente:"Sr. Méndez",tel:"953 118 9931",auto:"Nissan Versa 2019",placas:"MHZ-42-18",
     entrada:"lunes 10:30",avance:70,mec:"Chuy",estado:"reparacion",
     base:[["Cambio de balatas delanteras",1250],["Rectificado de discos",600]],
     extras:[{n:"Cambio de bujías",p:480,estado:"pendiente",hora:""}]},
    {folio:"A-1041",cliente:"Sra. Beatriz",tel:"953 102 4417",auto:"Chevrolet Aveo 2016",placas:"NKT-11-05",
     entrada:"lunes 08:15",avance:100,mec:"Lalo",estado:"listo",
     base:[["Afinación mayor",1850],["Filtro de aire",320]],
     extras:[{n:"Cambio de anticongelante",p:390,estado:"aprobado",hora:"11:20"}]},
    {folio:"A-1040",cliente:"Ing. Toledo",tel:"953 145 7788",auto:"VW Jetta 2021",placas:"PDR-88-42",
     entrada:"martes 09:00",avance:25,mec:"Chuy",estado:"diagnostico",
     base:[["Diagnóstico electrónico",450]],
     extras:[{n:"Sensor de oxígeno",p:1180,estado:"pendiente",hora:""}]},
  ],
  citas: [
    {hora:"09:00",cliente:"Familia Ruiz",tel:"953 100 2210",auto:"Honda CR-V 2020",serv:"Servicio 20 mil km",estado:"confirmada"},
    {hora:"11:30",cliente:"Sr. Palacios",tel:"953 109 8812",auto:"Mazda 3 2018",serv:"Revisión de frenos",estado:"confirmada"},
    {hora:"14:00",cliente:"Lic. Ortega",tel:"953 140 3391",auto:"Toyota Hilux 2022",serv:"Cambio de aceite y filtro",estado:"pendiente"},
    {hora:"16:30",cliente:"Sra. Nieto",tel:"953 122 7705",auto:"Kia Rio 2017",serv:"Servicio de clima",estado:"pendiente"},
  ],
  entregadas: [],
};
const totalOrden = o => o.base.reduce((s,[,p])=>s+p,0) + o.extras.filter(e=>e.estado==="aprobado").reduce((s,e)=>s+e.p,0);
const porAprobar = () => S.ordenes.reduce((n,o)=>n+o.extras.filter(e=>e.estado==="pendiente").length,0);
const enTaller = () => S.ordenes.filter(o=>o.estado!=="entregado");
const ESTADOS = {diagnostico:["Diagnóstico","warn"],reparacion:["En reparación","info"],listo:["Listo para entrega","ok"],entregado:["Entregado","neutral"]};
const SIG = {diagnostico:["reparacion",60,"Pasar a reparación"],reparacion:["listo",100,"Marcar listo"]};

function nuevaOrden(refrescar, pre){
  pre=pre||{};
  drawer("Nueva orden de servicio",`
    <div class="fc-row">${campo("Cliente",`<input name="cli" required value="${esc(pre.cliente||"")}" placeholder="Nombre">`)}
    ${campo("WhatsApp",`<input name="tel" value="${esc(pre.tel||"")}" placeholder="953 000 0000">`,"Aquí recibe el avance de su auto")}</div>
    <div class="fc-row">${campo("Vehículo",`<input name="auto" required value="${esc(pre.auto||"")}" placeholder="Marca, modelo y año">`)}
    ${campo("Placas",`<input name="pl" placeholder="ABC-12-34" style="text-transform:uppercase">`)}</div>
    ${campo("Trabajos solicitados",`<div class="pick">${S.servicios.map(([n,p],i)=>`<label><input type="checkbox" name="s_${i}" value="1"${pre.serv===n?" checked":""}><b>${esc(n)}</b><span>${money(p)}</span></label>`).join("")}</div>`)}
    <div class="fc-row">${campo("Mecánico",`<select name="mec">${opciones(S.mecanicos)}</select>`)}
    ${campo("Kilometraje",`<input name="km" type="number" min="0" placeholder="84500">`)}</div>
    ${campo("Lo que reporta el cliente",`<textarea name="nota" rows="2" placeholder="Ruido al frenar, jala a la derecha…"></textarea>`)}`,
    d=>{
      const base=S.servicios.filter((s,i)=>d["s_"+i]);
      if(!base.length){ toast("Marca al menos un trabajo","⚠️"); return false; }
      const o={folio:"A-"+(S.seq++),cliente:d.cli,tel:d.tel||"—",auto:d.auto,placas:(d.pl||"S/P").toUpperCase(),entrada:"hoy "+hora(),avance:10,mec:d.mec,estado:"diagnostico",base,extras:[],nota:d.nota,km:d.km};
      S.ordenes.unshift(o);
      toast(o.folio+" abierta · "+money(totalOrden(o))+" · enlace de seguimiento enviado a "+o.cliente,"🔧"); refrescar();
    },{enviar:"Abrir orden"});
}

const DEMO = {
  negocio:"Taller Rodríguez", rubro:"Servicio automotriz", emoji:"🔧",
  estado:{clave:"taller", get:()=>S, set:o=>{S=o;}},
  secciones:[
    {
      id:"ordenes", nombre:"Órdenes", ic:"🔧",
      titulo:"Vehículos en taller", sub:"Cada cliente ve el avance de su auto desde su celular",
      badge:()=>enTaller().length,
      accion:{txt:"+ Nueva orden", fn:nuevaOrden},
      render(root, refrescar){
        const hoy=S.entregadas.reduce((s,e)=>s+e.total,0);
        root.innerHTML = `
          <div class="kpis">
            <div class="kpi"><div class="lbl">En taller</div><div class="val">${enTaller().length}</div><div class="delta flat">${money(enTaller().reduce((s,o)=>s+totalOrden(o),0))} facturable</div></div>
            <div class="kpi"><div class="lbl">Listos para entrega</div><div class="val">${S.ordenes.filter(o=>o.estado==="listo").length}</div><div class="delta up">avisar al cliente</div></div>
            <div class="kpi"><div class="lbl">Presupuestos pendientes</div><div class="val">${porAprobar()}</div><div class="delta ${porAprobar()?"down":"up"}">${porAprobar()?"esperando al cliente":"al corriente"}</div></div>
            <div class="kpi"><div class="lbl">Ingresos del mes</div><div class="val">${money(S.ingresosMes+hoy)}</div><div class="delta up">${hoy?"hoy cobraste "+money(hoy):"aún sin entregas hoy"}</div></div>
          </div>
          ${enTaller().length?enTaller().map(o=>`
            <div class="panel">
              <div class="panel-h">
                <h2>${esc(o.folio)} · ${esc(o.auto)}</h2>
                <span class="sub">${esc(o.cliente)} · ${esc(o.placas)} · entró ${esc(o.entrada)} · mecánico ${esc(o.mec)}</span>
                <div class="right">
                  <span class="tag ${ESTADOS[o.estado][1]}">${ESTADOS[o.estado][0]}</span>
                  <b>${money(totalOrden(o))}</b>
                </div>
              </div>
              <div class="panel-b">
                <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px">
                  <div style="flex:1">${bar(o.avance/100)}</div>
                  <b style="white-space:nowrap">${o.avance}%</b>
                </div>
                ${o.nota?`<p style="font-size:.86rem;color:var(--ink-3);margin:0 0 10px">🗣️ ${esc(o.nota)}</p>`:""}
                <table class="tbl" style="font-size:.9rem">
                  <tbody>
                    ${o.base.map(([n,p])=>`<tr><td>${esc(n)}</td><td class="num">${money(p)}</td></tr>`).join("")}
                    ${o.extras.filter(e=>e.estado==="aprobado").map(e=>`<tr><td style="color:var(--ok)">${esc(e.n)} ✓ <span style="color:var(--ink-3);font-size:.82rem">aprobado ${esc(e.hora)}</span></td><td class="num" style="color:var(--ok)">${money(e.p)}</td></tr>`).join("")}
                    ${o.extras.filter(e=>e.estado==="rechazado").map(e=>`<tr><td style="color:var(--ink-3);text-decoration:line-through">${esc(e.n)}</td><td class="num" style="color:var(--ink-3)">no autorizado</td></tr>`).join("")}
                    <tr><td class="strong">Total</td><td class="num strong">${money(totalOrden(o))}</td></tr>
                  </tbody>
                </table>
                ${o.extras.filter(e=>e.estado==="pendiente").map(e=>`
                  <div class="note warn" style="margin-top:14px"><span class="ic">🔍</span><div style="flex:1">
                    <b>El mecánico encontró algo más</b>
                    <span>${esc(e.n)} · ${money(e.p)}. Se le envió al cliente para que autorice.</span>
                    <div class="actions" style="margin-top:9px">
                      <button class="btn sm primary" data-apr="${esc(o.folio)}|${o.extras.indexOf(e)}">Cliente aprobó</button>
                      <button class="btn sm" data-rej="${esc(o.folio)}|${o.extras.indexOf(e)}">Cliente rechazó</button>
                    </div></div></div>`).join("")}
                <div class="actions" style="margin-top:14px">
                  ${SIG[o.estado]?`<button class="btn sm primary" data-sig="${esc(o.folio)}">${SIG[o.estado][2]}</button>`:""}
                  ${o.estado!=="listo"?`<button class="btn sm" data-ext="${esc(o.folio)}">+ Trabajo extra</button>`:""}
                  ${o.estado==="listo"?`<button class="btn sm primary" data-ent="${esc(o.folio)}">Entregar y cobrar</button><button class="btn sm" data-avisar="${esc(o.folio)}">Avisar al cliente</button>`:""}
                </div>
              </div>
            </div>`).join(""):`<div class="panel"><div class="panel-b"><div class="empty"><div class="big">🧰</div><b>Taller vacío</b><p>Abre una orden nueva o recibe una cita desde la Agenda.</p></div></div></div>`}`;
        const buscar=f=>S.ordenes.find(x=>x.folio===f);
        root.querySelectorAll("[data-apr]").forEach(b=>b.onclick=()=>{
          const [f,i]=b.dataset.apr.split("|"), o=buscar(f), e=o.extras[+i];
          e.estado="aprobado"; e.hora=hora();
          toast("Autorización registrada con fecha y hora · total "+money(totalOrden(o)),"✅"); refrescar();
        });
        root.querySelectorAll("[data-rej]").forEach(b=>b.onclick=()=>{
          const [f,i]=b.dataset.rej.split("|"), o=buscar(f); o.extras[+i].estado="rechazado";
          toast("Registrado: el cliente no autorizó el trabajo extra","📝"); refrescar();
        });
        root.querySelectorAll("[data-sig]").forEach(b=>b.onclick=()=>{
          const o=buscar(b.dataset.sig), [est,av,]=SIG[o.estado]; o.estado=est; o.avance=av;
          toast(o.folio+" → "+ESTADOS[est][0]+" · el cliente ve el avance en su celular","📲"); refrescar();
        });
        root.querySelectorAll("[data-ext]").forEach(b=>b.onclick=()=>{
          const o=buscar(b.dataset.ext);
          drawer("Trabajo extra en "+o.folio,`<p style="font-size:.9rem;color:var(--ink-2)">${esc(o.auto)} · ${esc(o.cliente)}</p>
            ${campo("Qué se encontró",`<input name="n" required placeholder="Cambio de bujías">`)}
            ${campo("Costo",`<input name="p" type="number" min="1" required placeholder="480">`)}
            ${campo("Evidencia",`<select name="ev">${opciones(["Foto desde el celular del mecánico","Video corto","Sin evidencia"])}</select>`,"Se envía al cliente con la solicitud de autorización")}`,
            d=>{o.extras.push({n:d.n,p:+d.p,estado:"pendiente",hora:""}); toast("Presupuesto de "+money(+d.p)+" enviado a "+o.cliente+" por WhatsApp","📲"); refrescar();},{enviar:"Enviar al cliente"});
        });
        root.querySelectorAll("[data-avisar]").forEach(b=>b.onclick=()=>{
          const o=buscar(b.dataset.avisar);
          toast("WhatsApp enviado a "+o.cliente+": su "+o.auto+" está listo","📲");
        });
        root.querySelectorAll("[data-ent]").forEach(b=>b.onclick=()=>{
          const o=buscar(b.dataset.ent), t=totalOrden(o);
          drawer("Entregar "+o.folio,`<div class="ticket">
              <div class="r"><b>TALLER RODRÍGUEZ</b><span>${hora()}</span></div><div class="r"><span>${esc(o.auto)} · ${esc(o.placas)}</span><span>${esc(o.cliente)}</span></div><div style="height:8px"></div>
              ${o.base.map(([n,p])=>`<div class="r"><span>${esc(n)}</span><span>${money(p)}</span></div>`).join("")}
              ${o.extras.filter(e=>e.estado==="aprobado").map(e=>`<div class="r"><span>${esc(e.n)} (autorizado ${esc(e.hora)})</span><span>${money(e.p)}</span></div>`).join("")}
              <div class="r t"><span>TOTAL</span><span>${money(t)}</span></div></div>
            <div class="fc-row">${campo("Forma de pago",`<select name="pago">${opciones(["Efectivo","Tarjeta","Transferencia"])}</select>`)}
            ${campo("Próximo servicio en",`<select name="prox">${opciones([["5000","5,000 km"],["10000","10,000 km"],["0","Sin recordatorio"]],"5000")}</select>`)}</div>`,
            d=>{o.estado="entregado"; o.pago=d.pago; S.entregadas.unshift({folio:o.folio,cliente:o.cliente,auto:o.auto,placas:o.placas,total:t,hora:hora(),trabajos:[...o.base.map(x=>x[0]),...o.extras.filter(e=>e.estado==="aprobado").map(e=>e.n)]});
              toast(o.folio+" entregada · "+money(t)+" cobrados"+(+d.prox?" · recordatorio en "+miles(+d.prox)+" km":""),"🚗"); refrescar();},{enviar:"Cobrar y entregar"});
        });
      }
    },
    {
      id:"agenda", nombre:"Agenda", ic:"📅",
      titulo:"Citas de hoy", sub:"Los clientes agendan en línea y el sistema confirma solo",
      badge:()=>S.citas.filter(c=>c.estado==="pendiente").length||"",
      accion:{txt:"+ Nueva cita", fn:(refrescar)=>drawer("Nueva cita",`
          <div class="fc-row">${campo("Hora",`<select name="hora">${opciones(["08:00","09:00","10:00","11:30","13:00","14:00","15:30","16:30","17:30"].filter(h=>!S.citas.some(c=>c.hora===h&&c.estado!=="recibida")))}</select>`,"Solo aparecen horarios libres")}
          ${campo("Servicio",`<select name="serv">${opciones(S.servicios.map(s=>s[0]))}</select>`)}</div>
          <div class="fc-row">${campo("Cliente",`<input name="cli" required placeholder="Nombre">`)}${campo("WhatsApp",`<input name="tel" placeholder="953 000 0000">`)}</div>
          ${campo("Vehículo",`<input name="auto" required placeholder="Marca, modelo y año">`)}`,
        d=>{S.citas.push({hora:d.hora,cliente:d.cli,tel:d.tel||"—",auto:d.auto,serv:d.serv,estado:"confirmada"});S.citas.sort((a,b)=>a.hora.localeCompare(b.hora));
          toast("Cita de "+d.cli+" a las "+d.hora+" · confirmación enviada por WhatsApp","📅");refrescar();})},
      render(root, refrescar){
        root.innerHTML = `
          <div class="note info"><span class="ic">📅</span><div>
            <b>Agenda en línea</b>
            <span>Tus clientes eligen día y hora desde el enlace que compartes; el sistema evita empalmes y manda recordatorio la víspera.</span></div></div>
          <div class="panel">
            <div class="panel-h"><h2>Hoy</h2><span class="sub">${S.citas.length} citas · ${S.mecanicos.length} mecánicos disponibles</span></div>
            <div class="panel-b flush"><div class="tbl-wrap"><table class="tbl">
              <thead><tr><th>Hora</th><th>Cliente</th><th>Vehículo</th><th>Servicio</th><th>Estado</th><th></th></tr></thead>
              <tbody>${S.citas.map((c,i)=>`
                <tr>
                  <td class="strong">${esc(c.hora)}</td>
                  <td><b>${esc(c.cliente)}</b></td>
                  <td style="color:var(--ink-3)">${esc(c.auto)}</td>
                  <td>${esc(c.serv)}</td>
                  <td><span class="tag ${c.estado==="confirmada"?"ok":c.estado==="recibida"?"neutral":"warn"}">${esc(c.estado)}</span></td>
                  <td class="num"><div class="actions" style="justify-content:flex-end">${c.estado==="pendiente"
                    ? `<button class="btn sm primary" data-conf="${i}">Confirmar</button>`:c.estado==="confirmada"?`<button class="btn sm primary" data-rec="${i}">Recibir en taller</button>`:""}</div></td>
                </tr>`).join("")}</tbody>
            </table></div></div>
          </div>`;
        root.querySelectorAll("[data-conf]").forEach(b=>b.onclick=()=>{
          const c=S.citas[+b.dataset.conf]; c.estado="confirmada";
          toast("Cita de "+c.cliente+" confirmada · recordatorio programado","📲");
          refrescar();
        });
        root.querySelectorAll("[data-rec]").forEach(b=>b.onclick=()=>{
          const c=S.citas[+b.dataset.rec];
          nuevaOrden(()=>{ c.estado="recibida"; refrescar(); }, {cliente:c.cliente,tel:c.tel,auto:c.auto,serv:c.serv});
        });
      }
    },
    {
      id:"historial", nombre:"Historial", ic:"📚",
      titulo:"Historial por vehículo", sub:"Todo lo que se le ha hecho a cada auto, sin buscar en libretas",
      render(root){
        root.innerHTML = `
          ${S.entregadas.length?`<div class="panel">
            <div class="panel-h"><h2>Entregados hoy</h2><span class="sub">Cada entrega queda en el expediente del auto</span></div>
            <div class="panel-b flush"><table class="tbl"><tbody>${S.entregadas.map(e=>`<tr>
              <td><b>${esc(e.auto)} · ${esc(e.placas)}</b><br><span style="color:var(--ink-3);font-size:.82rem">${esc(e.cliente)} · ${e.hora} · ${e.trabajos.map(esc).join(", ")}</span></td>
              <td class="num strong">${money(e.total)}</td></tr>`).join("")}</tbody></table></div></div>`:""}
          <div class="panel">
            <div class="panel-h"><h2>Nissan Versa 2019 · MHZ-42-18</h2><span class="sub">Sr. Méndez · cliente desde 2023</span></div>
            <div class="panel-b">
              <div class="tl">
                <div class="tl-i now"><div class="tl-d">●</div><div><b>Frenos delanteros — ${money(1850)}</b><span>Hoy · balatas y rectificado de discos</span></div></div>
                <div class="tl-i done"><div class="tl-d">✓</div><div><b>Afinación menor — ${money(1450)}</b><span>12 mar 2026 · 78,400 km</span></div></div>
                <div class="tl-i done"><div class="tl-d">✓</div><div><b>Cambio de amortiguadores — ${money(4200)}</b><span>04 nov 2025 · 71,900 km</span></div></div>
                <div class="tl-i done"><div class="tl-d">✓</div><div><b>Servicio mayor — ${money(2890)}</b><span>18 jun 2025 · 65,100 km</span></div></div>
              </div>
              <div class="note ok" style="margin-top:16px"><span class="ic">💡</span><div>
                <b>Próximo servicio sugerido: 90,000 km</b>
                <span>Con el promedio de 1,100 km al mes, le tocaría en noviembre. El sistema le avisa solo.</span></div></div>
            </div>
          </div>
          <div class="panel">
            <div class="panel-h"><h2>Evidencia fotográfica</h2><span class="sub">El mecánico sube antes y después desde su celular</span></div>
            <div class="panel-b">
              <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px">
                ${[["🛞","Balata · antes"],["🔩","Disco · antes"],["⚙️","Refacción nueva"],["🛠️","Montaje"],["📸","Prueba de ruta"],["🚗","Entrega"]].map(([e,t])=>`
                  <div style="background:var(--bg);border-radius:11px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px">
                    <span style="font-size:1.8rem">${e}</span>
                    <small style="font-size:.74rem;color:var(--ink-3);text-align:center;padding:0 6px">${t}</small>
                  </div>`).join("")}
              </div>
              <p style="font-size:.86rem;color:var(--ink-3);margin-top:12px">Tu cliente ve la evidencia del trabajo, y tú te proteges de reclamos.</p>
            </div>
          </div>`;
      }
    }
  ]
};
startDemo(DEMO);
</script>
</body>
</html>
