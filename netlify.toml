[build]
  # Sitio estático: no hay paso de compilación, se publica la raíz del repo.
  publish = "."
  command = ""

# Cabeceras de seguridad y de caché
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# El HTML siempre fresco, para que un despliegue se vea de inmediato
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS y JS: siempre revalidar. Los nombres no llevan hash de contenido, así
# que con max-age largo quien ya visitó el sitio seguiría ejecutando la
# versión vieja durante horas después de cada despliegue. Con
# must-revalidate el navegador pregunta cada vez y recibe un 304 barato
# mientras el archivo no cambie.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Iconos e imagen social: cambian muy poco, se cachean una semana
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Netlify lo sirve como octet-stream y algunos navegadores lo ignoran
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
